<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Department</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #020617;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 30px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #cbd5f5;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(2, 6, 23, 0.9);
        }

        button {
            margin-top: 10px;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover { background: #1d4ed8; }
    </style>
</head>

<body>

    <div class="card">
        <h1>Add Department</h1>

        <form method="post" action="">
            {% csrf_token %}

            <label>Department Name</label>
            <input type="text" name="department_name" placeholder="Enter Department Name" required>

            <label>Address</label>
            <textarea name="address" rows="3" placeholder="Enter Office Address" required></textarea>

            <label>Contact Info</label>
            <input type="text" name="contact" placeholder="Phone number" required>

            <label>Email (Username)</label>
            <input type="email" name="Email" placeholder="email@citywatch.com" required>

            <label>Head Name</label>
            <input type="text" name="head" placeholder="Name of Department Head" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Set password for authority" required>

            <button type="submit">Register Department</button>
        </form>
    </div>

</body>
</html>
